name: Ping Supabase Project

on:
  schedule:
    # Roda a cada 12 horas
    - cron: '0 */12 * * *'
  # Permite rodar manualmente no painel do GitHub, se necessário
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Request to Supabase API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_PROJECT_URL }}/rest/v1/ordens_servico?select=numero_os&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
